<head>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body>
<div id="calculator" class="draggable">
<div id="calctopbar">
<button class="close" onclick="calctoggle()">X</button>
<button class="maximise">□</button>
</div>
<div class="resize"></div>
</div>
<div id="journal" class="draggable">
<div id="journaltopbar">
<button class="close" onclick="notestoggle()">X</button>
<button class="maximise">□</button>
</div>
<div class="resize"></div>
</div>
</body>
<footer style="display: flex; align-items: center;">
    <div id="start" style="background-image: linear-gradient( #656565, #2e2e2e);">
        <ul>
            <li style="display: flex; align-items: center;">
                <h1 id="calcheader">Calculator</h1>
                <button onclick="calctoggle()"  id="calculatorbutton"></button>
            </li>
            <li style="display: flex; align-items: center;">
                <h1 id="notesheader">Notes</h1>
                <button onclick="notestoggle()" id="journalbutton"></button>
            </li>
        </ul>
    </div>
    <button id="startbutton" onclick="starttoggle()"><img id="startbutton" src="start.png" alt="start button"></button>
    <canvas id="bar"></canvas>
</footer>
<script>
    let togglestart = false 
    let togglecalc = false
    let togglenotes = false
function starttoggle() {
    if (togglestart == false) {
        togglestart = true;
        document.getElementById("start").style.bottom = "4vh";
    } else {
        togglestart = false;
    document.getElementById("start").style.bottom = "-41vh";
    }
}
function calctoggle() {
    if (togglecalc == false) {
        togglecalc = true;
        document.getElementById("calculator").style.display = "none";
    } else {
        togglecalc = false;
    document.getElementById("calculator").style.display = "flex";
    }
}
function notestoggle() {
    if (togglenotes == false) {
        togglenotes = true;
        document.getElementById("journal").style.display = "none";
    } else {
        togglenotes = false;
    document.getElementById("journal").style.display = "flex";
    }
}
const dragElements = document.querySelectorAll(".draggable"); 

        function onMouseDrag(event, element) {
            let leftValue = parseInt(window.getComputedStyle(element).left);
            let topValue = parseInt(window.getComputedStyle(element).top);
            element.style.left = `${leftValue + event.movementX}px`;
            element.style.top = `${topValue + event.movementY}px`;
        }

        dragElements.forEach((element) => {
            element.addEventListener("mousedown", (e) => {
                const onMove = (event) => onMouseDrag(event, element); 

                document.addEventListener("mousemove", onMove);
                document.addEventListener("mouseup", () => {
                    document.removeEventListener("mousemove", onMove);
                }, { once: true });
            });
        });

</script>
